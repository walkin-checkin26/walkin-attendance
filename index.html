<style>
  :root{--bg:#0f172a;--card:#1e293b;--accent:#22c55e;--danger:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;}
  *{box-sizing:border-box;}
  body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;}
  h1{font-size:20px;margin:0 0 16px;}
  h2{font-size:16px;color:var(--muted);margin:24px 0 8px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px;}
  input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0f172a;color:var(--text);font-size:14px;}
  button{background:var(--accent);color:#04170a;font-weight:bold;border:none;cursor:pointer;margin-top:10px;}
  button.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  details.card{padding:0;overflow:hidden;}
  details.card summary{cursor:pointer;padding:14px 16px;font-weight:bold;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  details.card summary::-webkit-details-marker{display:none;}
  details.card summary::after{content:"▾";color:var(--muted);transition:transform .15s;}
  details.card[open] summary::after{transform:rotate(180deg);}
  details.card .inner{padding:0 16px 16px;}
  .msg{padding:10px;border-radius:8px;margin-top:10px;font-size:13px;}
  .msg.ok{background:#052e1a;color:#4ade80;border:1px solid #16653a;}
  .msg.err{background:#2e0505;color:#f87171;border:1px solid #651616;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{border:1px solid var(--border);padding:6px;text-align:center;}
  .hidden{display:none;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--border);}
  .code-display{text-align:center;padding:40px 16px;}
  .code-display .code{font-size:72px;font-weight:900;letter-spacing:6px;color:var(--accent);direction:ltr;word-break:break-all;}
  #reader{width:100%;max-width:400px;margin:0 auto;}
  #qr-canvas-wrap{background:white;padding:12px;border-radius:12px;display:inline-block;}

<body>

<div id="app"></div>

<script>
/* ============== الإعدادات ============== */
const FUNCTIONS_URL = "https://wicltyeasldcsvprfdnz.supabase.co/functions/v1";
/* ========================================= */

const params = new URLSearchParams(location.search);
const roleParam = params.get("role");
const role = roleParam === "admin" ? "admin" : roleParam === "display" ? "display" : "student";
const hallCodeParam = params.get("hall");
const app = document.getElementById("app");

function getDeviceId(){
  let id = localStorage.getItem("device_id");
  if(!id){ id = crypto.randomUUID(); localStorage.setItem("device_id", id); }
  return id;
}
// بيحوّل أي نص (قد يكون جاي من الداتابيس أو من إدخال مستخدم) لنص آمن قبل حقنه بالصفحة —
// عشان لو صار بالاسم/الرسالة حروف HTML (مثلاً اسم طالب فيه <script> بالغلط أو عن قصد)، تطلع كنص عادي وما تنفّذ.
function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function msg(text, ok){ return `<div class="msg ${ok?'ok':'err'}">${escapeHtml(text)}</div>`; }

function formatShortDate(isoDate){
  // "2026-09-30" -> "30-9-2026" (يوم-شهر-سنة، بدون أصفار زيادة)
  const [y,m,d] = String(isoDate).split("-");
  return `${parseInt(d,10)}-${parseInt(m,10)}-${y}`;
}

// يقرأ تاريخ مكتوب بصيغة يوم-شهر-سنة (مثل 30-9-2026 أو 30/9/2026، وبأرقام عربية كمان) ويرجّعه ISO (2026-09-30).
// فاضي = ما في تاريخ (null). غلط = undefined.
function parseDMY(text){
  const t = String(text||"").trim()
    .replace(/[٠-٩]/g, c => String("٠١٢٣٤٥٦٧٨٩".indexOf(c)))
    .replace(/[۰-۹]/g, c => String("۰۱۲۳۴۵۶۷۸۹".indexOf(c)));
  if(!t) return null;
  const m = t.match(/^(\d{1,2})[-\/.\s](\d{1,2})[-\/.\s](\d{4})$/);
  if(!m) return undefined;
  const d = +m[1], mo = +m[2], y = +m[3];
  const dt = new Date(Date.UTC(y, mo-1, d));
  if(dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo-1 || dt.getUTCDate() !== d) return undefined;
  return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
// يقرأ خانتي من/إلى ويتأكد منهم. يرجّع {from,to} أو {error}
function readDateRange(fromId, toId){
  const from = parseDMY(document.getElementById(fromId).value);
  const to = parseDMY(document.getElementById(toId).value);
  if(from === undefined || to === undefined) return { error: "اكتب التاريخ بصيغة يوم-شهر-سنة، مثال: 30-9-2026" };
  if(from && to && from > to) return { error: "تاريخ البداية بعد تاريخ النهاية — عدّلهم" };
  return { from, to };
}

function normalizeDate(val){
  if(val === "" || val === null || val === undefined) return null;
  // إكسل ممكن يرجع رقم تسلسلي لو الخانة منسّقة كتاريخ
  if(typeof val === "number"){
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    if(!isNaN(d)) return d.toISOString().slice(0,10);
    return null;
  }
  const s = String(val).trim();
  if(!s) return null;
  // ٢٠٢٦-٠٩-١٩ أو ٢٠٢٦/٠٩/١٩ (سنة-شهر-يوم) — الصيغة الصحيحة أصلاً
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  // ١٩-٠٩-٢٠٢٦ أو ١٩/٠٩/٢٠٢٦ (يوم-شهر-سنة)
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  // ١٩-٩ أو ١٩/٩ (يوم-شهر بس، بدون سنة) — نفترض السنة الحالية
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})$/);
  if(m) return `${new Date().getFullYear()}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  return null; // صيغة ما قدرنا نفهمها — نسيبها فاضية بدل ما نكسر الرفع كامل
}

async function callFn(name, body, monitorKey){
  const headers = { "Content-Type":"application/json" };
  if(monitorKey) headers["x-monitor-key"] = monitorKey;
  const res = await fetch(`${FUNCTIONS_URL}/${name}`, { method:"POST", headers, body: JSON.stringify(body||{}) });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || "حدث خطأ");
  return data;
}

/* =========================== واجهة الطالب (مسح QR أو كتابة الكود يدوياً) =========================== */
function renderStudent(){
  app.innerHTML = `
    <h1>تسجيل الحضور</h1>
    <div class="card">
      <label>الرقم الجامعي</label>
      <input id="uni-number" placeholder="اكتب رقمك الجامعي" value="${escapeHtml(localStorage.getItem('uni_number')||'')}"/>
    </div>
    <div class="card">
      <div id="reader"></div>
      <div id="scan-result"></div>
      <button id="rescan-btn" class="secondary hidden">امسح مرة ثانية</button>
      <p style="text-align:center;color:var(--muted);font-size:13px;margin:12px 0;">لو الكاميرا ما اشتغلت، اكتب الكود يدوياً تحت</p>
      <label>الكود (6 أرقام)</label>
      <input id="manual-token" placeholder="مثال: 482913" inputmode="numeric" maxlength="6"/>
      <button id="manual-submit">تسجيل حضور بالكود</button>
    </div>
  `;

  let busy = false;
  let cameraActive = false;
  const html5QrCode = new Html5Qrcode("reader");

  function startCamera(){
    if(cameraActive) return;
    cameraActive = true;
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      (decodedText)=>{ doSubmit(decodedText, true); },
      ()=>{}
    ).catch(err=>{
      cameraActive = false;
      document.getElementById("scan-result").innerHTML = msg("تعذّر فتح الكاميرا — استخدم الكتابة اليدوية تحت", false);
    });
  }

  async function doSubmit(token, fromCamera){
    if(busy) return;
    const uniNumber = document.getElementById("uni-number").value.trim();
    const resultBox = document.getElementById("scan-result");
    if(!uniNumber){
      resultBox.innerHTML = msg("اكتب رقمك الجامعي قبل المسح", false);
      return;
    }
    busy = true;

    // نوقف الكاميرا فوراً أول ما نقرا كود عشان ما تكرر نفس المسح وهي لسا شغالة
    if(fromCamera && cameraActive){
      cameraActive = false;
      try{ await html5QrCode.stop(); }catch(e){}
      document.getElementById("rescan-btn").classList.remove("hidden");
    }

    resultBox.innerHTML = msg("تم قراءة الكود، جاري التحقق...", true);
    try{
      const data = await callFn("submit-scan", {
        token,
        university_number: uniNumber,
        device_fingerprint: getDeviceId(),
      });
      // نحفظ الرقم بالمتصفح بس لما يكون صحيح ومقبول، عشان الرقم الغلط ما يعلق ويظل معبّى
      if(data.ok){ try{ localStorage.setItem("uni_number", uniNumber); }catch(e){} }
      resultBox.innerHTML = msg(data.message, data.ok);
    }catch(e){
      resultBox.innerHTML = msg("خطأ: "+e.message, false);
    }
    busy = false;
  }

  document.getElementById("rescan-btn").onclick = ()=>{
    document.getElementById("rescan-btn").classList.add("hidden");
    startCamera();
  };

  document.getElementById("manual-submit").onclick = ()=>{
    const t = document.getElementById("manual-token").value.trim();
    if(!t){ document.getElementById("scan-result").innerHTML = msg("اكتب الكود أولاً", false); return; }
    doSubmit(t, false);
  };

  startCamera();
}

/* =========================== شاشة القاعة (QR + رقم دوّار كل 40 ثانية) =========================== */
function renderDisplay(){
  if(!hallCodeParam){
    app.innerHTML = `<div class="card">${msg("هالرابط ناقصه كود القاعة (hall). اطلب الرابط الصحيح من الأدمن.", false)}</div>`;
    return;
  }
  app.innerHTML = `
    <div class="code-display">
      <div class="badge" id="d-hall-name">قاعة ${escapeHtml(hallCodeParam)}</div>
      <div id="qr-canvas-wrap" style="margin:16px auto;"><canvas id="qr-canvas"></canvas></div>
      <div class="code" id="d-code" style="font-size:48px;">------</div>
      <p style="color:var(--muted);font-size:14px;">امسح الكود بكاميرا موبايلك، أو اكتبه يدوياً لو الكاميرا تعطّلت</p>
      <div class="badge" id="d-timer">--</div>
      <div class="badge" id="d-count" style="margin-inline-start:8px;">عدد الحاضرين اليوم: --</div>
      <div style="margin:14px auto 0;max-width:360px;text-align:right;">
        <label>عدد الحاضرين لـ</label>
        <select id="d-section">
          <option value="auto">تلقائي — آخر شعبة سجّلت حضور</option>
          <option value="__all__">كل الشعب (المجموع)</option>
        </select>
        <details id="d-sections-box" style="margin-top:8px;">
          <summary>حضور اليوم لكل شعبة</summary>
          <div id="d-sections-list" style="font-size:14px;line-height:1.9;"></div>
        </details>
      </div>
      <div style="margin-top:20px;">
        <div style="max-width:320px;margin:0 auto 10px;text-align:right;">
          <label>احتساب الحضور والغياب من تاريخ (اختياري)</label><input id="d-from" type="text" inputmode="numeric" dir="ltr" autocomplete="off" placeholder="مثال: 30-9-2026"/>
          <label>إلى تاريخ (اختياري)</label><input id="d-to" type="text" inputmode="numeric" dir="ltr" autocomplete="off" placeholder="مثال: 30-9-2026"/>
        </div>
        <button class="secondary" id="d-export-btn">📥 تنزيل كشف الحضور (إكسل)</button>
        <div id="d-export-msg"></div>
      </div>
    </div>
  `;

  document.getElementById("d-export-btn").onclick = async ()=>{
    const msgEl = document.getElementById("d-export-msg");
    msgEl.innerHTML = msg("جارِ تجهيز الملف...", true);
    try{
      const range = readDateRange("d-from", "d-to");
      if(range.error){ msgEl.innerHTML = msg(range.error, false); return; }
      const r = await callFn("get-active-session", {
        hall_code: hallCodeParam, export: true,
        from_date: range.from,
        to_date: range.to,
      });
      if((document.getElementById("d-from").value || document.getElementById("d-to").value) && (!r.logs || r.logs.length === 0)){
        msgEl.innerHTML = msg("ما في أي حضور مسجّل بين هذين التاريخين — غيّر التاريخ أو اتركه فاضي لتنزيل كل الأيام", false);
        return;
      }
      buildExcel(r.students, r.halls, r.logs, r.university_name || "");
      msgEl.innerHTML = msg("تم تنزيل الملف", true);
    }catch(e){
      msgEl.innerHTML = msg(e.message, false);
    }
  };

  // ===== عدّاد الحضور حسب الشعبة =====
  // الرابط الواحد بيخدم كل شعب الجامعة، فالعدد بيتحسب إما "تلقائي" (آخر شعبة سجّلت حضور)، أو لشعبة تختارها، أو للكل.
  const SEC_KEY = "d_sec_" + hallCodeParam;
  let selectedSection = "auto";
  try{ selectedSection = localStorage.getItem(SEC_KEY) || "auto"; }catch(e){}
  const secSelect = document.getElementById("d-section");

  function renderCounts(r){
    if(!r) return;
    // لو السيرفر لسا على النسخة القديمة (ما رجّع تفاصيل الشعب)، نعرض العدد الإجمالي مؤقتاً
    if(!r.scope){
      if(r.attendance_count !== undefined) document.getElementById("d-count").innerText = "عدد الحاضرين اليوم: " + r.attendance_count;
      return;
    }
    // قائمة الشعب بالقائمة المنسدلة (نبني بالـ DOM عشان أسماء الشعب ما تنحقن كـ HTML)
    const names = (r.sections || []).map(x => x.name);
    const have = Array.from(secSelect.options).slice(2).map(o => o.value);
    if(have.join("\u0001") !== names.join("\u0001")){
      while(secSelect.options.length > 2) secSelect.remove(2);
      names.forEach(n => {
        const o = document.createElement("option");
        o.value = n; o.textContent = n || "(بدون اسم شعبة)";
        secSelect.appendChild(o);
      });
    }
    const valid = selectedSection === "auto" || selectedSection === "__all__" || names.includes(selectedSection);
    if(!valid){ selectedSection = "auto"; try{ localStorage.removeItem(SEC_KEY); }catch(e){} }
    secSelect.value = selectedSection;

    const sc = r.scope;
    let label;
    if(sc.mode === "all") label = `عدد الحاضرين اليوم (كل الشعب): ${sc.attended} من ${sc.total}`;
    else if(sc.section === null) label = "عدد الحاضرين اليوم: 0 — ما سجّل حدا حضور لهلأ";
    else label = `عدد الحاضرين اليوم — ${sc.section || "(بدون اسم شعبة)"}${sc.mode === "auto" ? " (تلقائي)" : ""}: ${sc.attended} من ${sc.total}`;
    document.getElementById("d-count").innerText = label;

    // تفاصيل كل الشعب
    const list = document.getElementById("d-sections-list");
    list.textContent = "";
    (r.sections || []).forEach(x => {
      const row = document.createElement("div");
      const isCur = (sc.mode !== "all" && sc.section === x.name);
      row.textContent = `${isCur ? "▶ " : ""}${x.name || "(بدون اسم شعبة)"}: ${x.attended} من ${x.total}`;
      if(isCur) row.style.fontWeight = "bold";
      list.appendChild(row);
    });
  }

  let countsBusy = false;
  async function refreshCounts(){
    if(countsBusy) return;
    countsBusy = true;
    try{
      const r = await callFn("get-active-session", { hall_code: hallCodeParam, counts_only: true, section: selectedSection });
      renderCounts(r);
    }catch(e){ /* نتجاهل — التحديث الجاي بعد 10 ثواني */ }
    countsBusy = false;
  }
  secSelect.onchange = ()=>{
    selectedSection = secSelect.value;
    try{ localStorage.setItem(SEC_KEY, selectedSection); }catch(e){}
    refreshCounts();
  };
  setInterval(refreshCounts, 10000);

  let countdownIv = null;
  async function tick(){
    // موعد النداء الجاي: افتراضياً بعد 40 ثانية (نفس مدة صلاحية الكود) — بس منعدّله تحت
    // حسب رد السيرفر، عشان النداء يوصل بالظبط لحظة ما ينتهي الكود، ما قبل وما بعد.
    let nextDelayMs = 40000;
    try{
      const r = await callFn("get-active-session", { hall_code: hallCodeParam, section: selectedSection });
      if(typeof QRCode === "undefined") throw new Error("مكتبة QRCode ما تحمّلت");
      await QRCode.toCanvas(document.getElementById("qr-canvas"), r.token, {width:320, margin:3, errorCorrectionLevel:"M"});
      document.getElementById("d-code").innerText = r.token;
      renderCounts(r);
      if(r.hall_name) document.getElementById("d-hall-name").innerText = r.hall_name + " — " + hallCodeParam;

      if(countdownIv) clearInterval(countdownIv);
      let remain = r.ttl_seconds;
      document.getElementById("d-timer").innerText = remain + "s";
      countdownIv = setInterval(()=>{
        remain -= 1;
        const t = document.getElementById("d-timer");
        if(t) t.innerText = Math.max(remain,0)+"s"; else clearInterval(countdownIv);
      }, 1000);

      // نطلب الكود الجاي بالظبط لحظة ما الحالي ينتهي (+نص ثانية هامش أمان)، مش على فترة ثابتة —
      // هيك ما في وقت "معلّق ع 0" قبل ما يطلع الكود الجديد.
      nextDelayMs = Math.max(1000, (r.ttl_seconds || 40) * 1000 + 500);
    }catch(e){
      const nameEl = document.getElementById("d-hall-name");
      if(nameEl) nameEl.innerText = "خطأ: " + e.message;
      nextDelayMs = 5000; // صار خطأ (شبكة مثلاً)، نعيد المحاولة بسرعة بدل ما نستنى 20 ثانية كاملة
    }
    setTimeout(tick, nextDelayMs);
  }
  tick();
}

/* =========================== لوحة الأدمن (3 أقسام بس) =========================== */
function renderAdmin(){
  const savedKey = sessionStorage.getItem("admin_key");
  if(!savedKey){
    app.innerHTML = `
      <h1>دخول الأدمن</h1>
      <div class="card">
        <label>مفتاح الأدمن</label>
        <input id="mkey" type="password" placeholder="أدخل المفتاح السري"/>
        <button id="mkey-btn">دخول</button>
        <div id="mkey-msg"></div>
      </div>`;
    document.getElementById("mkey-btn").onclick = async ()=>{
      const key = document.getElementById("mkey").value.trim();
      try{
        await callFn("monitor-action", { action:"list_universities", payload:{} }, key);
        sessionStorage.setItem("admin_key", key);
        renderAdmin();
      }catch(e){
        document.getElementById("mkey-msg").innerHTML = msg("خطأ: "+e.message, false);
      }
    };
    return;
  }

  const MK = savedKey;
  let state = { universities:[], halls:[], hallsUniId:null };
  let hallsLoadSeq = 0;

  app.innerHTML = `
    <h1>لوحة الأدمن</h1>
    <button class="secondary" id="logout-btn" style="margin-bottom:12px;">تسجيل خروج</button>

    <div class="card">
      <label>الجامعة الحالية</label>
      <select id="admin-uni"></select>
      <div id="current-uni-label" style="margin:8px 0;padding:8px;background:#eef6ff;border-radius:6px;font-weight:bold;"></div>
      <button class="secondary" id="uni-delete-btn" style="border-color:var(--danger);color:var(--danger);">🗑️ حذف هذه الجامعة (مع كل قاعاتها وطلابها وسجل حضورها)</button>
      <div id="uni-delete-msg"></div>
    </div>

    <details class="card" id="sec-setup" open>
      <summary>➕ الجامعات والقاعات</summary>

        <h2>إضافة جامعة</h2>

          ما بيلمس قاعدة البيانات أبداً، وبيطلّعك من لوحة الأدمن وتحتاج تدخل المفتاح من جديد.

  document.getElementById("logout-btn").onclick = ()=>{
    sessionStorage.removeItem("admin_key");
    renderAdmin();
  };
  document.getElementById("clear-btn").onclick = ()=>{
    if(!confirm("⚠️ متأكد إنك بدك تمسح كل البيانات المحفوظة بهذا المتصفح؟\n\n• رح يتم تسجيل خروجك من لوحة الأدمن وتحتاج تدخل المفتاح من جديد.\n• بينمسح الرقم الجامعي المحفوظ ومعرّف هذا الجهاز.\n• قاعدة البيانات (الطلاب والحضور والجامعات) ما رح تتأثر أبداً.\n\nإذا ما كنت متأكد اضغط إلغاء.")) return;
    localStorage.clear();
    sessionStorage.clear();
    document.getElementById("clear-msg").innerHTML = msg("تم مسح كل البيانات المحفوظة بالمتصفح", true);
    setTimeout(()=>renderAdmin(), 1200);
  };

  function uniOptions(){
    return state.universities.map(u=>`<option value="${escapeHtml(u.id)}">${escapeHtml(u.name)}</option>`).join("");
  }
  function currentUniId(){ return document.getElementById("admin-uni").value; }

  // يعيد بناء قائمة الجامعات بدون ما يفقد اختيار الأدمن الحالي.
  // preferId: لو بدك تحدد جامعة معينة تصير هي المختارة بعد البناء (مثلاً جامعة جديد انضافت توّا)
  function setUniOptions(preferId){
    const sel = document.getElementById("admin-uni");
    const prev = sel.value;
    sel.innerHTML = uniOptions();
    if(preferId && state.universities.some(u=>u.id===preferId)){
      sel.value = preferId;
    } else if(prev && state.universities.some(u=>u.id===prev)){
      sel.value = prev;
    }
    updateCurrentUniLabel();
  }
  function updateCurrentUniLabel(){
    const u = state.universities.find(u=>u.id===currentUniId());
    document.getElementById("current-uni-label").textContent = u
      ? `📌 كل البيانات تحت (القاعات، الروستر، التصدير) خاصة بـ: ${u.name}`
      : "⚠️ ما في جامعة مختارة — ضيف جامعة أولًا";
  }

  async function loadUniversities(){
    const r = await callFn("monitor-action", {action:"list_universities", payload:{}}, MK);
    state.universities = r.data || [];
  }
  // حماية من تضارب الطلبات: لو المستخدم بدّل الجامعة أو حذف/ضاف بسرعة، ممكن يوصل رد
  // قديم بعد رد أحدث منه ويعيد كتابة state.halls ببيانات غلط. seq بيضمن إنه بس آخر
  // طلب هو يلي بيأثر على الشاشة.
  async function loadHalls(uniId){
    const seq = ++hallsLoadSeq;
    if(!uniId){
      if(seq === hallsLoadSeq){ state.halls = []; state.hallsUniId = null; }
      return seq === hallsLoadSeq;
    }
    const r = await callFn("monitor-action", {action:"list_halls", payload:{university_id:uniId}}, MK);
    if(seq !== hallsLoadSeq) return false; // فيه طلب أحدث صار بعده، تجاهل هاد الرد القديم
    state.halls = r.data || [];
    state.hallsUniId = uniId;
    return true;
  }
  function renderHallsList(){
    // كل صف بياخد اسم جامعته من university_id الموجود فعلياً على القاعة نفسها،
    // مش من الجامعة "المختارة حالياً" بالقائمة — هيك ما ينخلط اسم جامعة بقاعة جامعة ثانية أبداً.
    document.getElementById("h-list").innerHTML = `
      <table><tr><th>القاعة</th><th>الكود</th><th>رابط المراقب (اضغط لنسخه)</th></tr>
      ${state.halls.map(h=>{
        const uniName = state.universities.find(u=>u.id===h.university_id)?.name || "";
        const link = `${location.origin}${location.pathname}?role=display&hall=${encodeURIComponent(h.hall_code)}`;
        return `<tr><td>${escapeHtml(h.name)} (${escapeHtml(uniName)})</td><td><b>${escapeHtml(h.hall_code)}</b></td><td><input readonly onclick="this.select();document.execCommand('copy');" value="${escapeHtml(link)}" style="font-size:11px;padding:4px;"/></td></tr>`;
      }).join("")}
      </table>`;
  }
  async function refreshForUni(){
    updateCurrentUniLabel();
    const uniId = currentUniId();
    const applied = await loadHalls(uniId);
    // لو تبدلت الجامعة المختارة وإحنا لسا مستنيين الرد (أو وصل رد قديم)، لا تعرض شي —
    // آخر نداء لـ refreshForUni هو يلي رح يكمل ويرسم الجدول.
    if(applied && currentUniId() === uniId){
      renderHallsList();
    }
  }

  document.getElementById("admin-uni").onchange = refreshForUni;

  document.getElementById("uni-delete-btn").onclick = async ()=>{
    const uniId = currentUniId();
    if(!uniId){ return; }
    const uniName = state.universities.find(u=>u.id===uniId)?.name || "";
    if(!confirm(`متأكد إنك بدك تحذف "${uniName}" مع كل قاعاتها وطلابها وسجل حضورها؟ هاد ما رح يرجع.`)) return;
    try{
      await callFn("monitor-action", {action:"delete_university", payload:{university_id: uniId}}, MK);
      await loadUniversities();
      setUniOptions();
      await refreshForUni();
      document.getElementById("uni-delete-msg").innerHTML = msg("تم الحذف", true);
    }catch(e){ document.getElementById("uni-delete-msg").innerHTML = msg(e.message,false); }
  };

  document.getElementById("u-add").onclick = async ()=>{
    try{
      const created = await callFn("monitor-action", {action:"add_university", payload:{
        name: document.getElementById("u-name").value.trim(),
        code: document.getElementById("u-code").value.trim(),
      }}, MK);
      await loadUniversities();
      setUniOptions(created?.data?.id);
      await refreshForUni();
      document.getElementById("u-name").value = "";
      document.getElementById("u-code").value = "";
      document.getElementById("u-msg").innerHTML = msg(`تمت الإضافة — الجامعة "${created?.data?.name||""}" هي المختارة الآن، كمّل ضيف قاعاتها وروسترها`, true);
    }catch(e){ document.getElementById("u-msg").innerHTML = msg(e.message,false); }
  };

  document.getElementById("h-add").onclick = async ()=>{
    if(!currentUniId()){ document.getElementById("h-msg").innerHTML = msg("لازم تختار جامعة أولًا من الأعلى", false); return; }
    try{
      await callFn("monitor-action", {action:"add_hall", payload:{
        university_id: currentUniId(),
        name: document.getElementById("h-name").value.trim(),
        hall_code: document.getElementById("h-code").value.trim(),
      }}, MK);
      await refreshForUni();
      document.getElementById("h-msg").innerHTML = msg("تمت الإضافة — رابط المراقب لهاي القاعة موجود بالجدول تحت", true);
    }catch(e){ document.getElementById("h-msg").innerHTML = msg(e.message,false); }
  };

  document.getElementById("r-upload").onclick = async ()=>{
    const fileInput = document.getElementById("r-file");
    const uniId = currentUniId();
    const uniName = state.universities.find(u=>u.id===uniId)?.name || "";
    const section = document.getElementById("r-section").value.trim();
    const replaceMode = document.getElementById("r-replace").checked;
    if(!uniId){ document.getElementById("r-msg").innerHTML = msg("لازم تختار جامعة أولًا من الأعلى", false); return; }
    if(!fileInput.files.length){ document.getElementById("r-msg").innerHTML = msg("اختر ملف أولًا", false); return; }
    if(replaceMode && !confirm(`متأكد إنك بدك تستبدل روستر الشعبة "${section||"(بدون اسم شعبة)"}" بالكامل لجامعة "${uniName}"؟ أي طالب قديم بهاي الشعبة مش موجود بالملف الجديد بينحذف هو وكل سجل حضوره السابق لهاي الشعبة — بدون أي استثناء. هذا ما يرجع.`)) return;
    try{
      const buf = await fileInput.files[0].arrayBuffer();
      const wb = XLSX.read(buf, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
      // نتعرف على عمود الاسم والرقم بأي صيغة شائعة لعنوان العمود (مش بس "اسم الطالب")
      const norm = h => String(h||"").toLowerCase().replace(/[\s_\-ـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي");
      const NAME_KEYS = ["اسمالطالب","الاسم","اسم","الاسمالكامل","اسمالطالبالكامل","اسمالطالبه","name","fullname","studentname"];
      const NUM_KEYS  = ["الرقمالجامعي","رقمالجامعي","رقمالطالب","الرقم","رقمالتسجيل","الرقمالجامعيللطالب","studentid","universitynumber","id"];
      const headers = rows.length ? Object.keys(rows[0]) : [];
      const nameCol = headers.find(h => NAME_KEYS.includes(norm(h)));
      const numCol  = headers.find(h => NUM_KEYS.includes(norm(h)));
      if(!numCol){
        throw new Error("ما لقيت عمود الرقم الجامعي بالملف. العناوين الموجودة: " + (headers.join("، ") || "لا يوجد") + " — سمّي عمود الرقم \"الرقم الجامعي\" وعمود الاسم \"اسم الطالب\".");
      }
      const students = rows
        .filter(r => String(r[numCol]).trim())
        .map(r => ({
          full_name: nameCol ? String(r[nameCol]||"").trim() : "",
          university_number: String(r[numCol]).trim(),
        }));
      const namesFound = students.filter(x => x.full_name).length;
      const nameWarn = !nameCol
        ? " ⚠️ ما لقيت عمود للأسماء بالملف (سمّيه \"اسم الطالب\") — الأسماء رح تكون فاضية."
        : (namesFound < students.length ? ` ⚠️ ${students.length - namesFound} طالب بدون اسم بالملف.` : "");
      const action = replaceMode ? "replace_roster" : "upload_roster";
      const r = await callFn("monitor-action", {action, payload:{
        university_id: uniId, section, students,
      }}, MK);
      const finalUniName = r.university_name || uniName || "(غير معروف)";
      const sectionText = section ? ` — الشعبة: ${section}` : "";
      if(replaceMode){
        const text = `✅ تم استبدال روستر الشعبة لجامعة "${finalUniName}"${sectionText} بالكامل — تم رفع/تحديث ${r.upserted||0} طالب جديد، وحذف ${r.removed||0} طالب قديم (مع كل سجل حضوره) — ما ضلت بيانات قديمة.`
          + ((r.matched === 0 && Array.isArray(r.other_sections) && r.other_sections.length)
              ? ` ⚠️ ما لقيت أي شعبة قديمة بهذا الاسم، فما انحذف أي طالب قديم. الشعب الموجودة حالياً بهذه الجامعة: ` + r.other_sections.map(x => `${x.name || "(بدون اسم)"} (${x.count})`).join("، ") + ` — اكتب اسم الشعبة بنفس كتابتها الحالية وأعد المحاولة.`
              : "")
          + nameWarn;
        document.getElementById("r-msg").innerHTML = msg(text, true);
      } else {
        document.getElementById("r-msg").innerHTML = msg(`✅ تم رفع روستر الشعبة لجامعة "${finalUniName}"${sectionText} — عدد الطلاب المرفوعين: ${r.count||0}${nameWarn}`, true);
      }
      if(document.getElementById("sec-sections").open) loadSections();
    }catch(e){
      document.getElementById("r-msg").innerHTML = msg(e.message, false);
    }
  };


  /* ---------- حذف الشعب ---------- */
  state.sections = [];
  async function loadSections(){
    const sel = document.getElementById("sc-select");
    const uniId = currentUniId();
    if(!uniId){ sel.innerHTML = ""; state.sections = []; return; }
    try{
      const r = await callFn("monitor-action", {action:"list_sections", payload:{university_id: uniId}}, MK);
      if(currentUniId() !== uniId) return; // تغيّرت الجامعة وإحنا مستنيين الرد
      state.sections = r.sections || [];
      sel.innerHTML = state.sections.length
        ? state.sections.map((x,i)=>`<option value="${i}">${escapeHtml(x.name || "(بدون اسم شعبة)")} — ${x.count} طالب</option>`).join("")
        : `<option value="">لا يوجد شعب لهذه الجامعة</option>`;
    }catch(e){
      document.getElementById("sc-msg").innerHTML = msg(e.message, false);
    }
  }
  document.getElementById("sec-sections").addEventListener("toggle", ()=>{
    if(document.getElementById("sec-sections").open) loadSections();
  });
  document.getElementById("admin-uni").addEventListener("change", ()=>{
    if(document.getElementById("sec-sections").open) loadSections();
  });
  document.getElementById("sc-refresh").onclick = loadSections;

  document.getElementById("sc-del-one").onclick = async ()=>{
    const uniId = currentUniId();
    const uniName = state.universities.find(u=>u.id===uniId)?.name || "";
    const item = state.sections[parseInt(document.getElementById("sc-select").value, 10)];
    if(!uniId || !item){ document.getElementById("sc-msg").innerHTML = msg("اختر شعبة أولًا", false); return; }
    const label = item.name || "(بدون اسم شعبة)";
    if(!confirm(`متأكد إنك بدك تحذف الشعبة "${label}" من جامعة "${uniName}"؟\nبينحذف ${item.count} طالب مع كل سجل حضورهم وربط أجهزتهم — بدون استثناء. هذا ما يرجع.`)) return;
    try{
      const r = await callFn("monitor-action", {action:"delete_section", payload:{university_id: uniId, section: item.name}}, MK);
      document.getElementById("sc-msg").innerHTML = msg(`✅ تم حذف الشعبة "${label}" من جامعة "${r.university_name||uniName}" — عدد الطلاب المحذوفين: ${r.removed||0}. فيك ترفعها من جديد.`, true);
      await loadSections();
    }catch(e){ document.getElementById("sc-msg").innerHTML = msg(e.message, false); }
  };

  document.getElementById("sc-del-all").onclick = async ()=>{
    const uniId = currentUniId();
    const uniName = state.universities.find(u=>u.id===uniId)?.name || "";
    if(!uniId){ document.getElementById("sc-msg").innerHTML = msg("لازم تختار جامعة أولًا", false); return; }
    const total = state.sections.reduce((a,x)=>a+x.count, 0);
    if(!confirm(`⚠️ بدك تحذف كل شعب جامعة "${uniName}" (${total} طالب) مع كل سجل حضورهم؟ هذا ما يرجع.`)) return;
    const typed = prompt(`للتأكيد النهائي اكتب كلمة: حذف`);
    if(typed === null || typed.trim() !== "حذف"){ document.getElementById("sc-msg").innerHTML = msg("تم الإلغاء — ما انحذف شي", false); return; }
    try{
      const r = await callFn("monitor-action", {action:"delete_section", payload:{university_id: uniId, all: true}}, MK);
      document.getElementById("sc-msg").innerHTML = msg(`✅ تم حذف كل شعب جامعة "${r.university_name||uniName}" — عدد الطلاب المحذوفين: ${r.removed||0}. فيك ترفع الروستر من جديد.`, true);
      await loadSections();
    }catch(e){ document.getElementById("sc-msg").innerHTML = msg(e.message, false); }
  };


  /* ---------- مواعيد المحاضرات ---------- */
  const DAY_NAMES = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const ALL_SECTIONS = "__all__";
  state.schedules = [];
  (function(){
    const box = document.getElementById("sch-days");
    DAY_NAMES.forEach((n,i)=>{
      const l = document.createElement("label");
      l.style.cssText = "display:flex;align-items:center;gap:4px;margin:0;font-weight:normal;";
      const c = document.createElement("input"); c.type="checkbox"; c.value=String(i); c.className="sch-day";
      c.style.cssText = "width:auto;margin:0;";
      l.appendChild(c); l.appendChild(document.createTextNode(n));
      box.appendChild(l);
    });
  })();
  function fixTime(t){
    t = String(t||"").trim().replace(/[٠-٩]/g, d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[.\s]/g,":");
    const m = t.match(/^(\d{1,2}):?(\d{2})$/);
    if(!m) return null;
    const h = parseInt(m[1],10), mi = parseInt(m[2],10);
    if(h>23 || mi>59) return null;
    return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
  }
  async function loadSchedules(){
    const uniId = currentUniId();
    const sel = document.getElementById("sch-select"), list = document.getElementById("sch-list");
    if(!uniId){ sel.innerHTML=""; list.textContent=""; return; }
    try{
      const [rs, rc] = await Promise.all([
        callFn("monitor-action", {action:"list_sections", payload:{university_id: uniId}}, MK),
        callFn("monitor-action", {action:"get_schedules", payload:{university_id: uniId}}, MK),
      ]);
      if(currentUniId() !== uniId) return;
      state.sections = rs.sections || [];
      state.schedules = rc.schedules || [];
      sel.innerHTML = "";
      const all = document.createElement("option"); all.value = ALL_SECTIONS; all.textContent = "كل شعب الجامعة"; sel.appendChild(all);
      state.sections.forEach((x,i)=>{ const o=document.createElement("option"); o.value=String(i); o.textContent = x.name || "(بدون اسم شعبة)"; sel.appendChild(o); });
      list.textContent = "";
      state.sections.forEach(x=>{
        const mine = state.schedules.filter(r=>String(r.section||"") === String(x.name||""));
        const row = document.createElement("div");
        const b = document.createElement("b"); b.textContent = (x.name || "(بدون اسم شعبة)") + ": ";
        row.appendChild(b);
        row.appendChild(document.createTextNode(mine.length
          ? mine.map(r=>`${DAY_NAMES[r.day_of_week]} ${r.start_time}–${r.end_time}`).join("، ")
          : "مفتوحة طوال اليوم (ما إلها موعد)"));
        list.appendChild(row);
      });
    }catch(e){ document.getElementById("sch-msg").innerHTML = msg(e.message, false); }
  }
  function schTargets(){
    const v = document.getElementById("sch-select").value;
    if(v === ALL_SECTIONS) return state.sections.map(x=>x.name);
    const it = state.sections[parseInt(v,10)];
    return it ? [it.name] : [];
  }
  async function schSave(replace){
    const uniId = currentUniId(), out = document.getElementById("sch-msg");
    const targets = schTargets();
    const days = Array.from(document.querySelectorAll(".sch-day:checked")).map(c=>parseInt(c.value,10));
    const start = fixTime(document.getElementById("sch-start").value), end = fixTime(document.getElementById("sch-end").value);
    if(!uniId || !targets.length){ out.innerHTML = msg("اختر جامعة وشعبة أولًا", false); return; }
    if(!days.length){ out.innerHTML = msg("اختر يوم واحد على الأقل", false); return; }
    if(!start || !end){ out.innerHTML = msg("اكتب الوقت بصيغة صحيحة مثل 10:30", false); return; }
    if(start >= end){ out.innerHTML = msg("وقت النهاية لازم يكون بعد البداية", false); return; }
    if(replace && !confirm("بدك تستبدل الجدول الحالي للشعب المختارة بهذا الموعد؟")) return;
    try{
      await callFn("monitor-action", {action:"add_schedule", payload:{university_id: uniId, sections: targets, days, start, end, replace: !!replace}}, MK);
      out.innerHTML = msg(`✅ تم حفظ الموعد (${days.map(d=>DAY_NAMES[d]).join("، ")} من ${start} إلى ${end}) لـ ${targets.length} شعبة`, true);
      await loadSchedules();
    }catch(e){ out.innerHTML = msg(e.message, false); }
  }
  document.getElementById("sch-add").onclick = ()=>schSave(false);
  document.getElementById("sch-replace").onclick = ()=>schSave(true);
  document.getElementById("sch-clear").onclick = async ()=>{
    const uniId = currentUniId(), out = document.getElementById("sch-msg");
    const isAll = document.getElementById("sch-select").value === ALL_SECTIONS;
    const targets = schTargets();
    if(!uniId || !targets.length){ out.innerHTML = msg("اختر شعبة أولًا", false); return; }
    if(!confirm(isAll ? "بدك تمسح مواعيد كل شعب الجامعة؟ بترجع كلها مفتوحة طوال اليوم." : "بدك تمسح موعد هذه الشعبة؟ بترجع مفتوحة طوال اليوم.")) return;
    try{
      const r = await callFn("monitor-action", {action:"clear_schedule", payload:{university_id: uniId, sections: targets, all: isAll}}, MK);
      out.innerHTML = msg(`✅ تم المسح (${r.removed||0} موعد)`, true);
      await loadSchedules();
    }catch(e){ out.innerHTML = msg(e.message, false); }
  };
  document.getElementById("sec-schedule").addEventListener("toggle", ()=>{ if(document.getElementById("sec-schedule").open) loadSchedules(); });
  document.getElementById("admin-uni").addEventListener("change", ()=>{ if(document.getElementById("sec-schedule").open) loadSchedules(); });

  document.getElementById("ed-upload").onclick = async ()=>{
    const fileInput = document.getElementById("ed-file");
    const uniId = currentUniId();
    if(!uniId){ document.getElementById("ed-msg").innerHTML = msg("لازم تختار جامعة أولًا من الأعلى", false); return; }
    if(!fileInput.files.length){ document.getElementById("ed-msg").innerHTML = msg("اختر ملف أولًا", false); return; }
    try{
      const buf = await fileInput.files[0].arrayBuffer();
      const wb = XLSX.read(buf, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
      const updates = rows
        .filter(r => r["الرقم الجامعي"])
        .map(r => ({
          university_number: String(r["الرقم الجامعي"]).trim(),
          full_name: String(r["الاسم"]||"").trim(),
          registration_date: String(r["تاريخ التسجيل"]||"").trim() || null,
          excuse_notes: String(r["الاعذار"]||"").trim(),
        }));
      const r = await callFn("monitor-action", {action:"update_student_details", payload:{
        university_id: uniId, updates,
      }}, MK);
      let text = `تم تحديث ${r.updated||0} طالب`;
      if(r.not_found && r.not_found.length){
        text += ` — ${r.not_found.length} رقم جامعي ما انلقى: ${r.not_found.slice(0,5).join(", ")}${r.not_found.length>5?"...":""}`;
      }
      if(r.failed && r.failed.length){
        text += ` — ${r.failed.length} صف فيه بيانات غلط ما تحدّث: ${r.failed.slice(0,5).join(", ")}${r.failed.length>5?"...":""}`;
      }
      document.getElementById("ed-msg").innerHTML = msg(text, true);
    }catch(e){
      document.getElementById("ed-msg").innerHTML = msg(e.message, false);
    }
  };

  document.getElementById("ub-run").onclick = async ()=>{
    const uniId = currentUniId();
    const number = document.getElementById("ub-number").value.trim();
    if(!uniId){ document.getElementById("ub-msg").innerHTML = msg("لازم تختار جامعة أولًا من الأعلى", false); return; }
    if(!number){ document.getElementById("ub-msg").innerHTML = msg("اكتب الرقم الجامعي أولًا", false); return; }
    try{
      const r = await callFn("monitor-action", {action:"unbind_device", payload:{
        university_id: uniId, university_number: number,
      }}, MK);
      document.getElementById("ub-msg").innerHTML = msg(
        r.removed > 0
          ? `✅ تم فك ربط جهاز "${r.student_name}" — بقدر يسجل من جهازه من جديد`
          : `الطالب "${r.student_name}" ما كان له جهاز مربوط أصلاً`,
        true
      );
      document.getElementById("ub-number").value = "";
    }catch(e){
      document.getElementById("ub-msg").innerHTML = msg(e.message, false);
    }
  };

  document.getElementById("e-run").onclick = async ()=>{
    if(!currentUniId()){ document.getElementById("e-msg").innerHTML = msg("لازم تختار جامعة أولًا من الأعلى", false); return; }
    try{
      const range = readDateRange("e-from", "e-to");
      if(range.error){ document.getElementById("e-msg").innerHTML = msg(range.error, false); return; }
      const r = await callFn("monitor-action", {action:"get_attendance", payload:{
        university_id: currentUniId(),
        from_date: range.from,
        to_date: range.to,
      }}, MK);
      const uniName = state.universities.find(u=>u.id===currentUniId())?.name || "";
      if((document.getElementById("e-from").value || document.getElementById("e-to").value) && (!r.logs || r.logs.length === 0)){
        document.getElementById("e-msg").innerHTML = msg("ما في أي حضور مسجّل بين هذين التاريخين — غيّر التاريخ أو اتركه فاضي لتصدير كل الأيام", false);
        return;
      }
      buildExcel(r.students, r.halls, r.logs, uniName);
      document.getElementById("e-msg").innerHTML = msg("تم توليد الملف وتنزيله", true);
    }catch(e){ document.getElementById("e-msg").innerHTML = msg(e.message,false); }
  };

  (async ()=>{
    await loadUniversities();
    setUniOptions();
    await refreshForUni();
  })();
}

/* =========================== بناء ملف الإكسل =========================== */
function buildExcel(students, halls, logs, uniName){
  // صف واحد لكل طالب (الاسم ما بيتكرر)، وعموديـن لكل تاريخ حضور:
  // - عمود الحضور (1/0) — فاصل تماماً عن المدة، ما في أي تشابه أو لخبطة.
  // - عمود "(دقيقة)" — المدة المحتسبة لهذا اليوم بالضبط (نفس حساب الدخول/الخروج يلي بيطلع للطالب)،
  //   0 لو غائب أو ما سجّل خروج بعد. ما في عمود إجمالي منفصل — كل يوم له مدته جنبه مباشرة.
  // التواريخ مرتبة تصاعدياً حسب التاريخ الحقيقي (ISO)، وعنوان كل عمود هو نفس التاريخ بصيغة D-M.
  const wb = XLSX.utils.book_new();
  const isoDates = Array.from(new Set((logs||[]).map(l=>l.checkin_date))).sort(); // ترتيب زمني صحيح لأنها ISO (YYYY-MM-DD)
  const dateColLabels = isoDates.map(formatShortDate);

  // ترتيب ثابت: حسب رقم الشعبة (1، 2، ... 9) ثم الاسم ثم الرقم الجامعي (كرقم) — عشان ما يطلع الملف مخربط
  const secKey = v => { const m = String(v||"").match(/\d+/); return m ? parseInt(m[0],10) : 1e9; };
  const sortedStudents = [...students].sort((a,b)=>
    secKey(a.section) - secKey(b.section) ||
    String(a.section||"").localeCompare(String(b.section||""), "ar") ||
    String(a.full_name||"").localeCompare(String(b.full_name||""), "ar") ||
    String(a.university_number||"").localeCompare(String(b.university_number||""), undefined, {numeric:true})
  );

  // أجهزة مشتركة: أي بصمة جهاز ظهرت مع أكثر من طالب بسجلات الحضور
  const fpStudents = new Map();
  (logs||[]).forEach(l=>{
    if(!l.device_fingerprint) return;
    if(!fpStudents.has(l.device_fingerprint)) fpStudents.set(l.device_fingerprint, new Set());
    fpStudents.get(l.device_fingerprint).add(l.student_id);
  });
  const numById = Object.fromEntries(students.map(x=>[x.id, x.university_number]));

  const rows = [];
  sortedStudents.forEach(st=>{
    const studentLogs = (logs||[]).filter(l=> l.student_id===st.id);
    const logByDate = Object.fromEntries(studentLogs.map(l=>[l.checkin_date, l]));
    const present = studentLogs.length;
    const absent = isoDates.length - present;

    const row = {
      "الاسم": st.full_name,
      "الرقم الجامعي": st.university_number,
      "الشعبة": st.section || "",
      "تاريخ التسجيل": st.registration_date || "",
      "الاعذار": st.excuse_notes || "",
    };
    isoDates.forEach((isoDate, i)=>{
      const l = logByDate[isoDate];
      const minsCol = dateColLabels[i] + " (دقيقة)";
      if(!l){ row[dateColLabels[i]] = 0; row[minsCol] = 0; return; } // غائب فعلاً
      row[dateColLabels[i]] = 1; // حاضر — بغض النظر عن المدة
      row[minsCol] = l.left_at ? Math.round((new Date(l.left_at) - new Date(l.checked_in_at)) / 60000) : 0;
    });
    row["الحضور"] = present;
    row["الغياب"] = absent;
    const sharedWith = new Set();
    studentLogs.forEach(l=>{
      (fpStudents.get(l.device_fingerprint) || []).forEach(id=>{ if(id !== st.id) sharedWith.add(numById[id] || id); });
    });
    row["جهاز مشترك مع (رقم جامعي)"] = Array.from(sharedWith).join("، ");
    rows.push(row);
  });

  const sheet = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, sheet, "سجل الحضور");

  const safeName = (uniName || "الحضور").replace(/[\\/:*?"<>|]/g, "_");
  XLSX.writeFile(wb, `بيانات_الحضور_${safeName}.xlsx`);
}

/* =========================== نقطة البداية =========================== */
if(role === "admin") renderAdmin();
else if(role === "display") renderDisplay();
else renderStudent();

if(role !== "student"){
  const ver = document.createElement("div");
  ver.textContent = "نسخة: 2026-10-20-F";
  ver.style.cssText = "position:fixed;bottom:4px;left:6px;font-size:11px;opacity:.55;direction:ltr;pointer-events:none;";
  document.body.appendChild(ver);
}
